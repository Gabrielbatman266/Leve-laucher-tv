plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.leve.share'
    compileSdk 34

    defaultConfig {
        applicationId 'com.leve.share'
        minSdk 21
        // 28: roda até em celular bem antigo e pede só a localização "aproximada" para o Wi-Fi Direct
        targetSdk 28
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    def ks = file('../app/leve.jks')
    def ksPass = System.getenv('KEYSTORE_PASS')
    def hasKey = ks.exists() && ksPass
    signingConfigs {
        leve {
            if (hasKey) {
                storeFile ks
                storePassword ksPass
                keyAlias 'leve'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig hasKey ? signingConfigs.leve : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
