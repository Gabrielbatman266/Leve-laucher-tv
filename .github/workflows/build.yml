name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/leve.jks
          else
            echo "::warning::Secret KEYSTORE_B64 não configurado — o botão Atualizar não vai conseguir instalar por cima."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk LeveLauncherTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LeveLauncherTV
          path: LeveLauncherTV.apk

      - name: Publicar Release (link direto do APK)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leve Launcher TV ${{ github.run_number }}
          files: LeveLauncherTV.apk
          make_latest: true
