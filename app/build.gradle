plugins {
    id 'com.android.application'
}

// No GitHub Actions cada build ganha um número maior (usado pelo "Atualizar")
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.leve.launchertv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.leve.launchertv'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Chave fixa vinda dos Secrets do GitHub (KEYSTORE_B64 / KEYSTORE_PASS).
    // Sem ela cada build teria assinatura diferente e a atualização pelo app falharia.
    def ks = file('leve.jks')
    def ksPass = System.getenv('KEYSTORE_PASS')
    def hasKey = ks.exists() && ksPass
    signingConfigs {
        leve {
            if (hasKey) {
                storeFile ks
                storePassword ksPass
                keyAlias 'leve'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig hasKey ? signingConfigs.leve : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
